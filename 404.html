<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;650;700;750&family=JetBrains+Mono:wght@500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Contrail</title><meta name="robots" content="noindex"></head>
<body><main>
<div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 20 C8 7 18 7 23 20" fill="none" stroke="#ECEFF5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="13" cy="10.3" r="2.4" fill="#FFC65C"/></svg> contrail</div>
<section id="flight" hidden>
  <h1 id="headline"></h1>
  <div class="card" style="margin-top:22px">
    <div style="display:flex;justify-content:space-between"><span class="label" id="airline"></span><span class="mono small" id="number"></span></div>
    <div class="route"><div><div class="iata" id="o"></div></div><div style="text-align:right"><div class="iata" id="d"></div></div></div>
    <div class="times"><div><span class="label">Departs</span><div class="mono" id="dep"></div></div><div><span class="label">Arrives</span><div class="mono" id="arr"></div></div></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:22px">
    <a class="btn" id="open" href="#">Open in Contrail</a>
    <p class="small" style="text-align:center">Don't have Contrail yet? Install it, then open this link again.</p>
  </div>
</section>
<section id="notfound" hidden>
  <h1>This page doesn't <span class="serif">exist.</span></h1>
  <p style="margin-top:12px">The link may be incomplete.</p>
  <a class="ghost" href="/" style="margin-top:22px">Go to Contrail</a>
</section>
</main>
<script>
(function () {
  var m = location.pathname.match(/^\/f\/([A-Za-z0-9_-]+)\/?$/);
  function show(id) { document.getElementById(id).hidden = false; }
  if (!m) { show('notfound'); return; }
  var token = m[1];
  try {
    var b64 = token.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var json = decodeURIComponent(Array.prototype.map.call(atob(b64), function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    var f = JSON.parse(json);
    if (!f.n || !f.o || !f.d || !f.sd) throw new Error('incomplete');
    var fmt = function (sec) {
      return new Date(sec * 1000).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
    };
    var set = function (id, text) { document.getElementById(id).textContent = text; };
    set('headline', (f.by ? f.by + ' is flying ' : 'Follow ') + f.n);
    set('airline', f.a || '');
    set('number', f.n);
    set('o', f.o);
    set('d', f.d);
    set('dep', fmt(f.sd));
    set('arr', f.sa ? fmt(f.sa) : '—');
    document.getElementById('open').href = 'contrail://f/' + token;
    document.title = f.n + ' · ' + f.o + ' → ' + f.d + ' · Contrail';
    show('flight');
  } catch (e) { show('notfound'); }
})();
</script>
</body></html>
